# Moves the commit pins of third-party actions daily (#544). Our own
# actions are followed at main; our wrappers are pinned by commit, which
# moves by hand with the broker's admission.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # A release has a week to be found compromised and pulled before a pin
    # moves to it.
    cooldown:
      default-days: 7
