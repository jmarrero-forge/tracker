# Moves the commit pins of third-party actions daily, those whose release
# tag is in a comment beside the pin. jmarrero-forge/actions is pinned by a
# bare commit, which this does not move, and agent-board's commit in
# .github/poll/agent-board.json is not an action: both are moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # A release has a week to be found compromised and pulled before a pin
    # moves to it.
    cooldown:
      default-days: 7
