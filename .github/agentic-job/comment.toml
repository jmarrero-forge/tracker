# Bounds for dispatch.yml's `triage` and `research` kinds, whose runs hand
# back comments only. dispatch.toml's repositories, and besides them
# bootc-dev's, as upstream has it: agent-board.json's operatorComments
# names bootc-dev/*, and agent-board starts only fix, triage and research
# runs from the operator's comments there (its docs/design.md,
# operatorComments), triage or research on someone else's pull request with
# a tracker issue as the item. Whether runs may answer in bootc-dev threads
# is jmarrero's decision before the poll applies (jmarrero-forge/tracker#42).
# implement and review keep dispatch.toml, which does not name bootc-dev,
# and a fix there is fix.toml's. This file opens no pull request and
# exempts no protected file anywhere.
hosts = ["github.com"]
# config.test.cjs keeps every name of dispatch.toml here.
repos = ["jmarrero-forge/tracker", "jmarrero-forge/actions", "jmarrero-forge/review", "jmarrero-forge/homegit", "jmarrero-forge/bootc", "jmarrero-forge/ostree", "jmarrero-forge/rpm-ostree", "bootc-dev/*"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
