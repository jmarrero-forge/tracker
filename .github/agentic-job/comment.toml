# Bounds for dispatch.yml's `triage` and `research` kinds, whose runs hand
# back comments only. dispatch.toml's repositories, and besides them
# bootc-dev's, as upstream has them (its decision D17): triage and research
# may answer in the bootc-dev thread an operator comment came from, and
# agent-board starts only fix, triage and research runs from those
# comments (its docs/design.md, operatorComments). Whether that holds here
# is jmarrero's decision before the pass applies (jmarrero-forge/tracker#42).
# Nothing else posts there:
# implement and review keep dispatch.toml (midstream.toml on a midstream
# fork), which does not name bootc-dev, and a fix there is fix.toml's.
# bootc-dev is external, so this file opens no pull request and exempts no
# protected file anywhere.
hosts = ["github.com"]
# config-test/ keeps every name of dispatch.toml and midstream.toml here.
repos = ["jmarrero-forge/tracker", "jmarrero-forge/actions", "jmarrero-forge/homegit", "jmarrero-forge/bootc", "jmarrero-forge/composefs-rs", "jmarrero-forge/bcvk", "jmarrero-forge/rpm-ostree", "jmarrero-forge/ostree", "jmarrero-forge/image-builder", "jmarrero-forge/osbuild", "bootc-dev/*"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
