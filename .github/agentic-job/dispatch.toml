# Bounds for dispatch.yml: the repositories a dispatched run may target.
# Exact names, no globs; add a repository here before dispatching to it.
# The bot's own repositories in jmarrero-forge, and the forge's forks of
# the upstreams it works on (bootc, ostree, rpm-ostree), which are targets
# for staged pull requests only: the poll does not follow them, so nothing
# merges into their main, which tracks upstream; the operator promotes work
# upstream.
hosts = ["github.com"]
repos = ["jmarrero-forge/tracker", "jmarrero-forge/actions", "jmarrero-forge/review", "jmarrero-forge/homegit", "jmarrero-forge/bootc", "jmarrero-forge/ostree", "jmarrero-forge/rpm-ostree"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
# `ready_when_complete`: apply opens complete work ready for review and only
# a checkpoint or a run stopped at a limit as a draft (agentic-job's
# docs/safe-outputs.md, "Ready or draft"). Without it every pull request is
# a draft and the poll stops on each as "a draft with no checkpoint" (#646).
# config.test.cjs keeps it set, here and in fix.toml.
create_pull_request = { max = 1, ready_when_complete = true }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# Pull requests (implement) may edit `.github/` in these repositories
# and no other; a fix's push may too, where fix.toml lists them. Exact names, no globs. The
# prerequisites are in agentic-job's docs/safe-outputs.md. `files` also lets them
# edit AGENTS.md, a protected file by default, there.
[unprotected_files]
# None yet: a repository is listed only once a ruleset on its main requires
# an approving review with stale approvals dismissed on push, since that
# review is the only gate on a run's `.github/` edit there, and no
# jmarrero-forge repository has one (jmarrero-forge/tracker#41). fix.toml
# keeps the same list. The files and folders below are upstream's, for when
# one is listed.
repos = []
# README.md too: a docs run there is refused otherwise (cgwalters-forge/agent-board#49).
# And every other name on agentic-job's default protected list, by the
# operator's decision (21 Oct): a blocked manifest or lockfile meant a run
# handed back a change CI couldn't build and a person had to land it
# (agentic-job#1450). The same review gates these as gates `.github/`, and
# each repository's review task checks dependency changes as supply chain.
files = ["AGENTS.md", "README.md", "package.json", "bun.lockb",
  "bunfig.toml", "deno.json", "deno.jsonc", "deno.lock", "global.json",
  "NuGet.Config", "Directory.Packages.props", "mix.exs", "mix.lock",
  "go.mod", "go.sum", "stack.yaml", "stack.yaml.lock", "pom.xml",
  "build.gradle", "build.gradle.kts", "settings.gradle",
  "settings.gradle.kts", "gradle.properties", "package-lock.json",
  "yarn.lock", "pnpm-lock.yaml", "npm-shrinkwrap.json", "requirements.txt",
  "Pipfile", "Pipfile.lock", "pyproject.toml", "setup.py", "setup.cfg",
  "Gemfile", "Gemfile.lock", "uv.lock", "CODEOWNERS", "DESIGN.md",
  "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "CLAUDE.md"]
dot_folders = [".github"]
