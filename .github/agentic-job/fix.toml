# Bounds for dispatch.yml's `fix` kind, which pushes to the branch of a
# pull request that apply itself opened from the bot's fork
# (cgwalters-forge/agentic-job#435): one commit on top, or the whole
# series again with the fix folded in. Apply may also push to another head
# repository, but only one whose default branch has
# `.github/agentic-job/accept-owner-branches` naming it (agentic-job's
# docs/safe-outputs.md), and `.github` stays refused there. A separate file
# from dispatch.toml because the push type has no per-repository list of
# its own: the repositories named here are the only ones a fix may target.
hosts = ["github.com"]
# dispatch.toml's repositories: every one the poll follows is among them.
repos = ["jmarrero-forge/tracker", "jmarrero-forge/actions", "jmarrero-forge/review", "jmarrero-forge/homegit", "jmarrero-forge/bootc", "jmarrero-forge/ostree", "jmarrero-forge/rpm-ostree"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
# `replacement_max_commits` is what lets a fix rewrite the branch
# (agentic-job's docs/safe-outputs.md, "Replacing the complete series"):
# review feedback is folded into the commit it corrects, never a commit of
# its own. Each commit of the series is checked like a patch, and the push
# is a force with a lease on the head the run was pinned to.
push_to_pull_request_branch = { max = 1, branches = ["dispatch/**"], replacement_max_commits = 5 }
# A blocked fix must explain itself without inventing a patch. Check pins
# this comment to the run's pull request; no labels or other writes are added.
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# The same list as dispatch.toml's, which poll.test.cjs checks: none yet.
[unprotected_files]
repos = []
files = []
dot_folders = []
