                Object.assign(g.observation, {signature: hash(job), job, occurrences,
                  run_ids: Array.from({length: runs}, (_, i) => i + 1), samples: []});
                if (runs === 1) g.findings = [];
                if (index[g.observation.signature]) {
                  g.classification = index[g.observation.signature]; g.class = 'flake';
                  g.findings.push('flake_unexplained_over_seven_days');
                }
                return g;
              });
              if (reverse) r.groups.reverse();
              const p = r.targets[0].populations.default_push;
              Object.assign(p, {runs: 20, attempts: 20, expected_attempts: 20, failed: 20,
                denominator: 20, pass_rate: 0, first_attempt_failed: 20,
                first_attempt_denominator: 20, first_attempt_pass_rate: 0});
              const got = await run({report: r, index, publish, preview: false});
              assert.ifError(got.error);
              const signatures = text => [...text.matchAll(/Signature ([a-f0-9]{64})\./g)].map(m => m[1]);
              assert.deepEqual(signatures(got.files.get('2026-11-05.md')), expected);
