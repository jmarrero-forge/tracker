            const admitted = new Function('cancelled', 'steps', `return ${guard.replace('outputs.dated-ready', "outputs['dated-ready']")}`);
            for (const options of [{}, {summaryFailure: true}, {apiFailure: true},
              {apiFailure: true, comments: [owned(marker + '\n## Rolling CI health: 2026-11-05\n\nold')]},
              {fullPages: true}, {manifest: {source_revision: 'f'.repeat(40)}},
              {writeFailure: '2026-11-05.json'}, {writeFailure: '2026-11-05.md'}]) {
              const got = await run({...options, publish: true, preview: false});
              const ready = !options.manifest && !options.writeFailure;
              assert.equal(got.outputs['dated-ready'], ready ? 'true' : undefined);
              assert.equal(Boolean(got.error), Object.keys(options).length > 0);
              if (ready) {
                assert.deepEqual(JSON.parse(got.files.get('2026-11-05.json')), report());
                assert.match(got.files.get('2026-11-05.md'), /INCOMPLETE OBSERVATIONS/);
              }
              for (const cancelled of [false, true]) assert.equal(
                admitted(() => cancelled, {render: {outputs: got.outputs}}), ready && !cancelled);
            }
            assert.match(upload, /if-no-files-found: error\n          retention-days: 35/);
          });
          test('wrong ref, missing/oversized report, wrong schema/targets/provenance/rates refuse writes', async () => {
            const badSchema = report(); badSchema.schema = 'other';
            const badTarget = report(); badTarget.targets.pop();
            const badRate = report(); badRate.targets[0].populations.default_push.pass_rate = 1;
            for (const options of [{ref: 'refs/heads/topic'}, {missing: 'report.json'}, {missing: 'provenance.json'}, {oversize: true},
              {manifest: {source_revision: 'f'.repeat(40)}}, {manifest: {collector_revision: sha}}, {rev: ''}, {rev: 'main'}, {report: badSchema}, {report: badTarget}, {report: badRate}]) {
              const got = await run({...options, publish: true, preview: false});
              assert.ok(got.error, JSON.stringify(options)); assert.equal(got.calls.length, 0);
              assert.match(got.summaries.join(), /REPORT REFUSED/);
            }
          });
          test('window timestamps must be canonical before naming artifacts or publishing', async () => {
            for (const field of ['since', 'until']) {
              const original = report()[field];
              for (const value of [original.slice(0, 10), original.slice(0, 10).replaceAll('-', '/'), original.replace('T', ' '),
                original.replace('Z', '+00:00'), original.replace('.000Z', 'Z')]) {
                const r = report(); r[field] = value;
                // Slash dates parse as local midnight, not UTC. These fixtures
                // need to be parseable but noncanonical, not the same instant.
                assert.ok(Number.isFinite(Date.parse(value)), value);
                const result = await run({report: r, publish: true, preview: false});
                assert.match(result.error?.message ?? '', /invalid\/stale window/, `${field}: ${value}`);
                assert.equal(result.files.size, 2);
                assert.deepEqual(result.outputs, {});
                assert.equal(result.calls.length, 0);
              }
            }
            // Date.parse normalizes February 30 to March 2 instead of refusing it.
            for (const field of ['since', 'until']) {
              const r = report();
              const normalized = Date.UTC(2026, 2, 2);
              const end = field === 'until' ? normalized : normalized + 30 * 86400000;
              r.since = iso(end - 30 * 86400000); r.until = iso(end);
              const valid = await run({report: r, now: end + 3600000});
              assert.ifError(valid.error);
              assert.ok(valid.files.has(r.until.slice(0, 10) + '.md'));
              r[field] = '2026-02-30T00:00:00.000Z';
              const result = await run({report: r, now: end + 3600000, publish: true, preview: false});
              assert.match(result.error?.message ?? '', /invalid\/stale window/);
              assert.equal(result.files.size, 2);
              assert.deepEqual(result.outputs, {});
              assert.equal(result.calls.length, 0);
            }
          });

          test('impossible run/attempt populations refuse before rendering or publication', async () => {
            for (const population of ['default_push', 'pull_request']) {
              for (const [runs, attempts, expected] of [[0, 1, 1], [2, 1, 2], [1, 1, 101], [501, 501, 501]]) {
                const r = report(), populations = r.targets[0].populations;
                Object.assign(populations[population], {runs, attempts, expected_attempts: expected,
                  success: attempts, denominator: attempts, pass_rate: 1});
                // Each population can fit separately while their shared listing exceeds its cap.
                if (runs === 501) Object.assign(populations[population === 'default_push' ? 'pull_request' : 'default_push'],
                  {runs: 500, attempts: 500, expected_attempts: 500, skipped: 500});
                const got = await run({report: r, publish: true, preview: false});
                assert.ok(got.error, `${population}: ${runs}/${attempts}/${expected}`);
                assert.equal(got.calls.length, 0);
                assert.equal(got.files.has('2026-11-05.md'), false);
                assert.match(got.summaries.join(), /REPORT REFUSED/);
              }
            }
          });
          test('terminal attempts beyond first tries must fit the rerun budget', async () => {
            for (const population of ['default_push', 'pull_request']) {
