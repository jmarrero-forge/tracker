              const got = await run({...options, publish: true, preview: false}); assert.ok(got.error); assert.equal(got.calls.length, 0);
            }
          });
          test('untrusted excerpts are escaped, recurrence retained, sample links constrained', async () => {
            const r = observedReport(); r.groups = [group()];
            const got = await run({report: r}); assert.ifError(got.error);
