            assert.match(md, /pull_request \| INCOMPLETE attempts\/logs \| 6 \| 7\/8 \| 33\.3% \(1\/3\) \| 50\.0% \(2\/4\) \| 0\/1\/1\/1/);
            assert.match(md, /INCOMPLETE OBSERVATIONS/); assert.match(md, /log unavailable; partial failure evidence/);
            assert.match(md, /2 runs, 2 occurrences; first observed in window 2026-11-04T00:00:00Z; recurring_without_issue/);
