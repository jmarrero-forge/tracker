          test('whole-entry truncation retains priority and discloses a first entry too large to fit', async () => {
            for (const oversized of [false, true]) {
              const r = observedReport();
              r.groups = Array.from({length: 13}, (_, i) => {
                const g = group(); g.observation.signature = hash(String(i));
                // Put the only recurring finding last in input order.
