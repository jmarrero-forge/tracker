# An agent's review of every pull request here, through our deployment's
# review entrypoint, jmarrero-forge/actions' cgwalters-review.yml, which
# composes agentic-job v0.6.9's review jobs with our tailnet join and
# inference defaults, and admits PRs as agentic-job's review.yml did
# (#625). It reads its bounds (workflow/review.toml,
# workflow/review-command.toml) and its task (workflow/review.md) from
# this repository's base branch, its agent, model, runner and inference
# settings from repository variables (the actions README, "Review"), and
# the runner's configuration from agentic-job's hosted.toml unless the
# variable AGENT_CONFIG names a file here. Pinned by SHA, not followed at
# main as our other callers are (#544), so that this gate changes only by
# a reviewed change here; the job_workflow_ref the tailnet and inference
# broker admit then names that commit, so move the pin and that admission
# together.
# With the variable AGENT_REAL_REVIEWS it also submits the verdict as a
# review by github-actions[bot], an approval whatever files change, this
# one and the review's own bounds and task included (agentic-job#540).
# Upstream makes that verdict its only merge gate; here main's ruleset also
# requires a person's approval.
# Off until the repository variable AGENT_REVIEW is set: a review comments
# on the pull request, and nothing here writes before the review gate is set
# up (jmarrero-forge/tracker#41).
name: review
on:
  # Runs this file from the base branch. No job here checks out the pull
  # request: the agent fetches the head as data inside its sandbox, with
  # no credential, and no secret is passed to the called workflow.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  review:
    if: >-
      vars.AGENT_REVIEW != '' && (github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')))
    # Base-owned policy; the head is fetched only as data inside the sandbox.
    uses: jmarrero-forge/actions/.github/workflows/cgwalters-review.yml@3bbed7bfd3c81fc6620fd5f49a5c1bbaf4629e6c # main, agentic-job v0.6.9 (actions#3)
    # The union of the wrapper's job grants: statuses for its compatibility
    # status, id-token for the tailnet join. No SAFE_OUTPUTS_PAT: the
    # wrapper gives it only to apply, the comment fallback; real reviews
    # submit with the job token.
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
      id-token: write
      statuses: write
